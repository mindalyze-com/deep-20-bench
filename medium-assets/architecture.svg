<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#0B1220" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#626A78"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5662FF"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F6F4ED"/>
  <rect x="58" y="50" width="136" height="36" rx="18" fill="#B7F000"/>
  <text x="126" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1220">GAME LOOP</text>
  <text x="58" y="145" font-family="Georgia, serif" font-size="50" font-weight="700" fill="#0B1220">One game. Four isolated model roles.</text>
  <text x="58" y="190" font-family="Arial, sans-serif" font-size="20" fill="#59606D">Ordinary software controls what each model may see.</text>

  <g filter="url(#shadow)">
    <rect x="58" y="280" width="265" height="250" rx="20" fill="#0B1220"/>
    <rect x="382" y="280" width="265" height="250" rx="20" fill="#FFFFFF" stroke="#CFCFC8" stroke-width="2"/>
    <rect x="706" y="280" width="265" height="250" rx="20" fill="#FFFFFF" stroke="#CFCFC8" stroke-width="2"/>
    <rect x="1030" y="280" width="265" height="250" rx="20" fill="#FFFFFF" stroke="#CFCFC8" stroke-width="2"/>
    <rect x="1354" y="280" width="188" height="250" rx="20" fill="#FFF7D9" stroke="#E5BE3C" stroke-width="2"/>
  </g>

  <rect x="83" y="307" width="57" height="29" rx="14" fill="#B7F000"/>
  <text x="111" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#0B1220">LLM</text>
  <text x="83" y="385" font-family="Georgia, serif" font-size="35" font-weight="700" fill="#FFFFFF">Guesser</text>
  <text x="83" y="430" font-family="Arial, sans-serif" font-size="17" fill="#D5D9E2">Asks questions and</text>
  <text x="83" y="457" font-family="Arial, sans-serif" font-size="17" fill="#D5D9E2">makes the final guess.</text>
  <text x="83" y="501" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#B7F000">MODEL UNDER TEST</text>

  <rect x="407" y="307" width="91" height="29" rx="14" fill="#EEF0FF"/>
  <text x="452" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#4854E8">SOFTWARE</text>
  <text x="407" y="385" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#0B1220">Game engine</text>
  <text x="407" y="430" font-family="Arial, sans-serif" font-size="17" fill="#59606D">Enforces turns, schema,</text>
  <text x="407" y="457" font-family="Arial, sans-serif" font-size="17" fill="#59606D">history, and isolation.</text>

  <rect x="731" y="307" width="57" height="29" rx="14" fill="#EEF0FF"/>
  <text x="759" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#4854E8">LLM</text>
  <text x="731" y="385" font-family="Georgia, serif" font-size="35" font-weight="700" fill="#0B1220">Oracle</text>
  <text x="731" y="430" font-family="Arial, sans-serif" font-size="17" fill="#59606D">Researches the current</text>
  <text x="731" y="457" font-family="Arial, sans-serif" font-size="17" fill="#59606D">question with evidence.</text>
  <text x="731" y="501" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#59606D">KNOWS THE SUBJECT</text>

  <rect x="1055" y="307" width="57" height="29" rx="14" fill="#EEF0FF"/>
  <text x="1083" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#4854E8">LLM</text>
  <text x="1055" y="385" font-family="Georgia, serif" font-size="35" font-weight="700" fill="#0B1220">Reviewer</text>
  <text x="1055" y="430" font-family="Arial, sans-serif" font-size="17" fill="#59606D">Checks the evidence</text>
  <text x="1055" y="457" font-family="Arial, sans-serif" font-size="17" fill="#59606D">without seeing the answer.</text>
  <text x="1055" y="501" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#59606D">INDEPENDENT DECISION</text>

  <rect x="1379" y="307" width="57" height="29" rx="14" fill="#FFE9A8"/>
  <text x="1407" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#8C6200">LLM</text>
  <text x="1379" y="385" font-family="Georgia, serif" font-size="35" font-weight="700" fill="#0B1220">Judge</text>
  <text x="1379" y="430" font-family="Arial, sans-serif" font-size="17" fill="#59606D">Decides only when</text>
  <text x="1379" y="457" font-family="Arial, sans-serif" font-size="17" fill="#59606D">they disagree.</text>
  <text x="1379" y="501" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#8C6200">OPTIONAL ESCALATION</text>

  <line x1="333" y1="405" x2="368" y2="405" stroke="#626A78" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="657" y1="405" x2="692" y2="405" stroke="#626A78" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="981" y1="405" x2="1016" y2="405" stroke="#626A78" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1305" y1="405" x2="1340" y2="405" stroke="#C28B12" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1324" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8C6200">IF NEEDED</text>

  <path d="M 1448 555 C 1448 680, 518 675, 213 565" fill="none" stroke="#5662FF" stroke-width="4" marker-end="url(#blueArrow)"/>
  <rect x="612" y="646" width="515" height="54" rx="27" fill="#EEF0FF"/>
  <text x="869" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4854E8">Only YES · NO · UNKNOWN returns to the Guesser</text>

  <rect x="58" y="768" width="1484" height="82" rx="16" fill="#FFFFFF" stroke="#D9D7CF" stroke-width="2"/>
  <circle cx="101" cy="809" r="11" fill="#B7F000"/>
  <text x="132" y="817" font-family="Arial, sans-serif" font-size="22" fill="#0B1220">The Guesser never sees the hidden subject, searches, evidence, reviews, or reasoning.</text>
</svg>
