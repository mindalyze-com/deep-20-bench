<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#0B1220" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#747B87"/>
    </marker>
  </defs>
  <rect width="1500" height="840" fill="#F6F4ED"/>
  <rect x="54" y="50" width="168" height="36" rx="18" fill="#B7F000"/>
  <text x="138" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1220">OUTPUT CONTRACT</text>
  <text x="54" y="145" font-family="Georgia, serif" font-size="50" font-weight="700" fill="#0B1220">A broken response stays in the score.</text>
  <text x="54" y="190" font-family="Arial, sans-serif" font-size="20" fill="#59606D">No silent repair. One standard reminder. Then the game continues.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="270" width="420" height="410" rx="20" fill="#FFFFFF"/>
    <rect x="540" y="270" width="420" height="410" rx="20" fill="#FFF1ED" stroke="#F06449" stroke-width="3"/>
    <rect x="1026" y="270" width="420" height="410" rx="20" fill="#FFFFFF"/>
  </g>

  <rect x="82" y="300" width="90" height="34" rx="17" fill="#EAF6EC"/>
  <text x="127" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#287640">TURN 10</text>
  <text x="82" y="382" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#0B1220">Valid ASK</text>
  <rect x="82" y="417" width="364" height="155" rx="12" fill="#0B1220"/>
  <text x="106" y="451" font-family="Menlo, monospace" font-size="15" fill="#B7F000">{</text>
  <text x="125" y="481" font-family="Menlo, monospace" font-size="15" fill="#FFFFFF">"action": "ASK",</text>
  <text x="125" y="511" font-family="Menlo, monospace" font-size="15" fill="#FFFFFF">"question": "Was …?"</text>
  <text x="106" y="541" font-family="Menlo, monospace" font-size="15" fill="#B7F000">}</text>
  <text x="82" y="625" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#287640">✓ Contract followed</text>

  <rect x="568" y="300" width="90" height="34" rx="17" fill="#FBD8CF"/>
  <text x="613" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#A53E29">TURN 11</text>
  <text x="568" y="382" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#A53E29">Contract breach</text>
  <rect x="568" y="417" width="364" height="92" rx="12" fill="#F06449"/>
  <text x="750" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">MODEL BROKE THE</text>
  <text x="750" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">OUTPUT CONTRACT</text>
  <rect x="568" y="530" width="176" height="40" rx="20" fill="#0B1220"/>
  <text x="656" y="556" text-anchor="middle" font-family="Menlo, monospace" font-size="14" font-weight="700" fill="#B7F000">FORMAT_ERROR</text>
  <text x="568" y="610" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#A53E29">+1 counted turn</text>
  <text x="568" y="642" font-family="Arial, sans-serif" font-size="15" fill="#59606D">Raw malformed output is not shown</text>

  <rect x="1054" y="300" width="90" height="34" rx="17" fill="#EAF6EC"/>
  <text x="1099" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#287640">TURN 12</text>
  <text x="1054" y="382" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#0B1220">Recovered</text>
  <rect x="1054" y="417" width="364" height="155" rx="12" fill="#0B1220"/>
  <text x="1078" y="451" font-family="Menlo, monospace" font-size="15" fill="#B7F000">{</text>
  <text x="1097" y="481" font-family="Menlo, monospace" font-size="15" fill="#FFFFFF">"action": "ASK",</text>
  <text x="1097" y="511" font-family="Menlo, monospace" font-size="15" fill="#FFFFFF">"question": "Did …?"</text>
  <text x="1078" y="541" font-family="Menlo, monospace" font-size="15" fill="#B7F000">}</text>
  <text x="1054" y="625" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#287640">✓ Game continues</text>

  <line x1="486" y1="482" x2="526" y2="482" stroke="#747B87" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="972" y1="482" x2="1012" y2="482" stroke="#747B87" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="54" y="737" width="1392" height="54" rx="27" fill="#0B1220"/>
  <text x="750" y="771" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Reliability is measured separately from gameplay - and both remain visible.</text>
</svg>
