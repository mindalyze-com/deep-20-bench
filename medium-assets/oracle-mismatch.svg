<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0B1220" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#707682"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="#F6F4ED"/>
  <rect x="52" y="52" width="82" height="36" rx="18" fill="#B7F000"/>
  <text x="93" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1220">AUDIT</text>
  <text x="52" y="145" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#0B1220">Correct evidence. Wrong token.</text>
  <text x="52" y="187" font-family="Arial, sans-serif" font-size="20" fill="#59606D">Simplified reconstruction of an early prototype failure</text>

  <g filter="url(#shadow)">
    <rect x="52" y="245" width="395" height="380" rx="18" fill="#FFFFFF"/>
    <rect x="502" y="245" width="395" height="380" rx="18" fill="#FFFFFF"/>
    <rect x="952" y="245" width="395" height="380" rx="18" fill="#FFF1ED" stroke="#F06449" stroke-width="3"/>
  </g>

  <text x="82" y="292" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#59606D">QUESTION</text>
  <text x="82" y="353" font-family="Georgia, serif" font-size="30" fill="#0B1220">“Was this person</text>
  <text x="82" y="396" font-family="Georgia, serif" font-size="30" fill="#0B1220">born before 1800?”</text>
  <rect x="82" y="510" width="160" height="43" rx="21" fill="#EEF0FF"/>
  <text x="162" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#4854E8">GUESSER ASKS</text>

  <text x="532" y="292" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#59606D">ORACLE EVIDENCE</text>
  <text x="532" y="352" font-family="Georgia, serif" font-size="27" fill="#0B1220">“Albert Einstein was</text>
  <text x="532" y="391" font-family="Georgia, serif" font-size="27" fill="#0B1220">born on March 14,</text>
  <text x="532" y="430" font-family="Georgia, serif" font-size="27" fill="#0B1220">1879.”</text>
  <line x1="532" y1="495" x2="815" y2="495" stroke="#D9D7CF" stroke-width="2"/>
  <text x="532" y="535" font-family="Arial, sans-serif" font-size="16" fill="#59606D">Nobel Prize biography</text>
  <rect x="532" y="559" width="170" height="38" rx="19" fill="#EAF6EC"/>
  <text x="617" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#287640">SUPPORTS “NO”</text>

  <text x="982" y="292" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#A53E29">ORACLE RETURNED</text>
  <circle cx="1149" cy="428" r="92" fill="#F06449"/>
  <text x="1149" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">YES</text>
  <text x="1149" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#A53E29">INCORRECT</text>

  <line x1="457" y1="435" x2="487" y2="435" stroke="#707682" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="907" y1="435" x2="937" y2="435" stroke="#707682" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="52" y="682" width="1295" height="86" rx="14" fill="#0B1220"/>
  <circle cx="93" cy="725" r="11" fill="#B7F000"/>
  <text x="122" y="733" font-family="Arial, sans-serif" font-size="23" fill="#FFFFFF">One wrong bit can redirect every question that follows.</text>
</svg>
