version: 1
roles:
  oracle:
    implementation: ollama
    # Replace this with an installed model that supports tools and structured output.
    model: your-installed-model:tag
    base_url: http://127.0.0.1:11434
    context_tokens: 32768
    max_output_tokens: 4096
    think: false
    research: parallel
research:
  search_mode: basic
  max_search_requests: 8
  max_extract_requests: 4
  max_model_rounds: 12
  deadline_seconds: 300
