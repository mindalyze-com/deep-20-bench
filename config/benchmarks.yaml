version: 2
benchmarks:
  B-0001:
    benchmark_id: B-0001
    display_name: Deep20Bench Core Subjects
    default_iterations: 3
    game_policy:
      version: 9
      benchmark_mode: experimental
      max_questions: 40
      max_consecutive_contract_violations: 5
      reveal_entity_type: true
      final_guess_after_limit: true
      include_oracle_evidence: true
      include_guesser_conversation: true
    oracle_configuration:
      gateway: openrouter
      model: openai/gpt-5.6-luna
      provider: openai
      reasoning_effort: medium
      allow_fallbacks: false
      parallel_search: true
      parallel_search_mode: fast
      max_search_results: 5
      max_output_tokens: 4096
      timeout_seconds: 120
      recovery: &default_recovery
        max_elapsed_seconds: 300
        max_request_attempts: 8
        no_result_retries: 1
        invalid_output_retries: 1
      reviewer: &standard_reviewer
        gateway: openrouter
        model: google/gemini-3.5-flash-lite
        provider: google-ai-studio
        reasoning_effort: medium
        allow_fallbacks: false
        token_limit_parameter: max_tokens
        max_output_tokens: 4096
        timeout_seconds: 120
        recovery: *default_recovery
      judge: &standard_judge
        gateway: openrouter
        model: anthropic/claude-opus-5
        provider: openrouter-auto
        provider_routing: automatic
        reasoning_effort: medium
        allow_fallbacks: true
        token_limit_parameter: max_tokens
        max_output_tokens: 4096
        timeout_seconds: 120
        recovery: *default_recovery
    validator_configuration: &standard_validator
      configuration_id: gpt-5.6-luna-validator
      gateway: openrouter
      model: openai/gpt-5.6-luna
      provider: openai
      reasoning_effort: medium
      allow_fallbacks: false
      max_output_tokens: 4096
      timeout_seconds: 120
      recovery: *default_recovery
      prompt_cache:
        policy: best_effort
        control: automatic
        minimum_cacheable_tokens: 1024
        ttl_seconds: 300
        input_usd_per_million: "1.00"
        cached_input_usd_per_million: "0.10"
        cache_write_multiplier: "1.25"

  B-0002:
    benchmark_id: B-0002
    display_name: Deep20Bench Concise Prompt Experiment
    default_iterations: 5
    game_policy:
      version: 9
      benchmark_mode: experimental
      prompt_profile: concise_v1
      max_questions: 40
      max_consecutive_contract_violations: 5
      reveal_entity_type: true
      final_guess_after_limit: true
      include_oracle_evidence: true
      include_guesser_conversation: true
    oracle_configuration:
      prompt_profile: concise_v1
      gateway: openrouter
      model: openai/gpt-5.6-luna
      provider: openai
      reasoning_effort: medium
      allow_fallbacks: false
      parallel_search: true
      parallel_search_mode: fast
      max_search_results: 5
      max_output_tokens: 4096
      timeout_seconds: 120
      recovery: *default_recovery
      reviewer: *standard_reviewer
      judge: *standard_judge
    validator_configuration: *standard_validator

  B-0003:
    benchmark_id: B-0003
    display_name: Deep20Bench Five Answer Experiment
    default_iterations: 3
    game_policy:
      version: 9
      benchmark_mode: experimental
      prompt_profile: qualified_v1
      max_questions: 40
      max_consecutive_contract_violations: 5
      reveal_entity_type: true
      final_guess_after_limit: true
      include_oracle_evidence: true
      include_guesser_conversation: true
    oracle_configuration:
      prompt_profile: qualified_v1
      adjudication_policy: concise_knowledge_v1
      gateway: openrouter
      model: openai/gpt-5.6-luna
      provider: openai
      reasoning_effort: medium
      allow_fallbacks: false
      parallel_search: true
      parallel_search_mode: fast
      max_search_results: 5
      max_output_tokens: 4096
      timeout_seconds: 120
      recovery: *default_recovery
      reviewer: *standard_reviewer
      judge: *standard_judge
    validator_configuration: *standard_validator
