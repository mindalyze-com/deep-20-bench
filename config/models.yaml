      provider: stealth
      reasoning_effort: high
      # The route supports JSON-object mode but did not advertise strict JSON
      # Schema enforcement on 2026-08-23. The same action contract is validated
      # locally, and invalid output receives the normal scored FORMAT_ERROR.
      structured_output_mode: json_object
      allow_fallbacks: false
      max_output_tokens: 32768
      timeout_seconds: 120
      recovery: *default_recovery
      # The Stealth route did not advertise seed support on 2026-08-23.
      seed_capability: unsupported
      prompt_cache:
        policy: best_effort
        control: automatic
        minimum_cacheable_tokens: 1024
        ttl_seconds: 300
        # OpenRouter advertised free input and output for the pinned Stealth
        # route on 2026-08-23. No prompt-cache savings are assumed.
        input_usd_per_million: "0.00"
        cached_input_usd_per_million: "0.00"
