version: 3
# Retired models
# These models did not work reliably in benchmark runs and are not registered:
# - DeepSeek V4 Flash (high)
# - Mistral Small 3.2 24B (non-thinking)
# - Nemotron 3 Super (thinking)
# - Qwen3.6 35B-A3B (thinking)
# - GLM 5.2 (high)
# - Gemma 4 26B-A4B (thinking)
models:
  M-0001:
    model_id: M-0001
    display_name: GPT-5.6 Luna (high)
    configuration:
      configuration_id: M-0001
      gateway: openrouter
      model: openai/gpt-5.6-luna
      provider: openai
      reasoning_effort: high
      allow_fallbacks: false
      max_output_tokens: 32768
      timeout_seconds: 120
      recovery: &default_recovery
        max_elapsed_seconds: 300
        max_request_attempts: 8
        no_result_retries: 1
        invalid_output_retries: 1
      seed_capability: unsupported
      prompt_cache:
        policy: best_effort
        control: automatic
        minimum_cacheable_tokens: 1024
        ttl_seconds: 300
        input_usd_per_million: "1.00"
        cached_input_usd_per_million: "0.10"
        cache_write_multiplier: "1.25"
  M-0002:
    model_id: M-0002
    display_name: gpt-oss-120B (high)
