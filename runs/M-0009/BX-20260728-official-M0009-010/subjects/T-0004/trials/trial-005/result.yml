        meaning the factual adjudication system could not determine the proposition
        under its evidence

        policy. Questions requiring proof of absence, exclusivity, completeness, exact
        counts, or

        subjective classification are more likely to return UNKNOWN. Prefer direct,
        positively

        verifiable properties when possible.


        The initial BEGIN event includes an opaque variation_token that contains no
        information about

        the hidden subject. Do not interpret, repeat, mention, or derive meaning from
        it. After BEGIN,

        each user reply is either one adjudicated YES, NO, or UNKNOWN token or a fixed
