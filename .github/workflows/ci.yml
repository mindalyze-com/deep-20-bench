name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.14.6"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: publication/site/package-lock.json

      - name: Install Python
        run: uv python install 3.14.6

      - name: Install benchmark dependencies
        run: uv sync --frozen

      - name: Check benchmark packages
        run: |
          uv run ruff check benchmark game oracle scripts
          uv run mypy
          uv run pytest -q -m "not integration"

      - name: Install publication dependencies
        run: uv sync --project publication --group dev --frozen

      - name: Check publication package
        run: |
          uv run --project publication ruff check publication
          uv run --project publication mypy publication/src publication/tests
          uv run --project publication pytest -q publication/tests

      - name: Install site dependencies
        run: npm ci --prefix publication/site

      - name: Check site and generated publication
        run: |
          npm run --prefix publication/site check
          uv run --project publication deep20-publication build --check

      - name: Check local Markdown links
        run: uv run python scripts/check-markdown-links.py
