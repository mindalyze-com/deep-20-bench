[project]
name = "deep20-publication"
version = "0.1.0"
description = "Independent, deterministic publication compiler for Deep20Bench."
authors = [
  { name = "Patrick Heusser" },
  { name = "Markus Tuor" },
]
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic>=2.12,<3",
  "pyyaml>=6.0.3,<7",
  "typer>=0.21,<1",
]

[project.scripts]
deep20-publication = "deep20_publication.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=9",
  "ruff>=0.14",
  "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep20_publication"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
